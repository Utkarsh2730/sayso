# One-click deploy on Render (render.com): New > Blueprint > pick this repo. No keys needed.
# Optional: add ANTHROPIC_API_KEY in the dashboard to use Claude instead of the built-in engine.
services:
  - type: web
    name: sayso
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: PUBLIC_MODE
        value: "1"
      - key: NODE_VERSION
        value: "22"
      - key: LIMIT_PER_WORKSPACE
        value: "40"
      - key: LIMIT_GLOBAL
        value: "1500"
